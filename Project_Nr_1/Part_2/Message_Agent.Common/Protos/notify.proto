syntax = "proto3";

option csharp_namespace = "GrpcAgent";

package GrpcAgent;

service Notifier {
  rpc Listen (ListenRequest) returns (stream DeliveryMessage);
}

message ListenRequest {}

message DeliveryMessage {
  string id = 1;
  string topic = 2;
  string message = 3;
  string created_at = 4;
}