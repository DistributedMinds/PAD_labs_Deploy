app = "pad-broker-sandu"
primary_region = "fra"

[build]

[env]
  PORT = "8080"
  DB_PATH = "/data/broker_messages.db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.http_options]
    h2_backend = true

[mounts]
  source = "broker_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"